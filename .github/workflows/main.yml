name: LogiTrack - CI (Integración Continua)

on:
  push:
    branches: [ "develop", "trunk" ]
  pull_request:
    branches: [ "develop", "trunk" ]

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar calidad de código
        run: npm run lint

  test:
    name: Tests + Cobertura
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV:   test
      JWT_SECRET: test-secret-ci-only-not-production
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas con cobertura
        run: npm run test:coverage

      - name: Verificar umbral de cobertura (≥ 50% líneas)
        run: |
          LINES=$(cat coverage/coverage-summary.json | python3 -c \
            "import sys,json; d=json.load(sys.stdin); print(d['total']['lines']['pct'])")
          echo "Cobertura de líneas: $LINES%"
          python3 -c "import sys; pct=float('$LINES'); sys.exit(0 if pct>=50 else 1)"

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
